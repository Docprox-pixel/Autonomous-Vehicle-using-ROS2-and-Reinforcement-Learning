# robot_localization EKF: wheel odometry + IMU  ->  odom -> base_link  (no GPS)
# Inputs follow the sensor contract, so this file works for any simulator bridge.
#
# State vector order for *_config:  [x, y, z,  roll, pitch, yaw,
#                                     vx, vy, vz, vroll, vpitch, vyaw,
#                                     ax, ay, az]
ekf_filter_node:
  ros__parameters:
    use_sim_time: true
    frequency: 50.0
    sensor_timeout: 0.2
    two_d_mode: true              # car on (mostly) flat roads
    publish_tf: true              # the bridge must NOT also publish odom -> base_link
    print_diagnostics: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # Wheel odometry: trust the measured speed, and vy = 0 (a car cannot slide sideways:
    # non-holonomic constraint). Its integrated pose is ignored, the EKF integrates itself.
    odom0: /wheel/odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_queue_size: 10
    odom0_differential: false

    # IMU: absolute heading (yaw) and yaw rate. Heading from the IMU keeps the EKF from
    # drifting in angle, which is what causes most position drift.
    imu0: /imu/data
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_queue_size: 20
    imu0_differential: false
    imu0_remove_gravitational_acceleration: true
